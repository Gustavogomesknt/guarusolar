# Fly.io — Guarusolar em produção (README, "Publicar em produção").
# Troque "guarusolar-sistema" em app, API_URL_PUBLICA e CORS_ORIGINS se o nome já existir no Fly.
app = "guarusolar-sistema"
primary_region = "gru" # São Paulo, junto do Supabase

[build]
  dockerfile = "Dockerfile"

# Configuração que não é segredo. Segredos (banco, JWT, Microsoft) vão com `fly secrets set`.
[env]
  NODE_ENV = "production"
  TZ = "America/Sao_Paulo"
  PORT = "8080"
  TRUST_PROXY = "1" # o Fly fica na frente: o IP real vem no X-Forwarded-For (limite do login)
  API_URL_PUBLICA = "https://guarusolar-sistema.fly.dev" # link do PDF que o cliente recebe
  CORS_ORIGINS = "https://guarusolar-sistema.fly.dev"
  JWT_EXPIRES_IN = "12h"
  JWT_EXPIRES_IN_TECNICO = "7d"
  # Sem SharePoint, fotos não têm onde ficar: o app dos técnicos fica bloqueado sozinho.
  # Com o SharePoint configurado (segredos MS_*): STORAGE_PROVIDER = "sharepoint".
  STORAGE_PROVIDER = "disco"

[deploy]
  # Migrations antes de cada versão, numa máquina à parte. Se falharem, nada é publicado.
  release_command = "npx prisma migrate deploy --schema apps/api/prisma/schema.prisma"
  # Sobe a versão nova ao lado da antiga, espera o /saude e só então troca: sem queda.
  strategy = "bluegreen"

[http_service]
  internal_port = 8080
  force_https = true
  # sempre ligada: sem "acordar" lento quando o técnico abre o app
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

  # /saude só responde 200 se a API alcança o banco
  [[http_service.checks]]
    grace_period = "20s"
    interval = "15s"
    timeout = "5s"
    method = "GET"
    path = "/saude"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
