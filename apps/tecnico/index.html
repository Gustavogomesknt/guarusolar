<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: o app ocupa a tela toda no iPhone (margens com env(safe-area-inset-*)) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b2f5e" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%sol.svg" />
    <!-- iPhone: ícone, nome e barra de status do app adicionado à tela inicial (o Safari usa estas
         marcações além do manifest). Barra "default" (clara, texto escuro): com "black-translucent"
         a hora e a bateria ficariam brancas sobre o fundo claro da tela de login. -->
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Guarusolar" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Guarusolar Técnico</title>
  </head>
  <body>
    <div id="raiz"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
