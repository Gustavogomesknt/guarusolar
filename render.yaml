# Render — Guarusolar em produção (README, "Publicar em produção (Render)").
# Blueprint: na Render, New › Blueprint › escolha este repositório. Um serviço só: API +
# escritório (/) + app dos técnicos (/campo/). Plano gratuito: dorme após 15 min parado e o
# primeiro pedido leva de 30 a 60 s (as telas avisam: AvisoDeConexao).
#
# ATENÇÃO ao editar: todo "value:" deste arquivo é REAPLICADO na Render a cada sincronização do
# Blueprint, por cima do que estiver no painel. O que é ajustado no painel tem de estar aqui com
# o valor de produção ou com "sync: false" (a Render não toca).
services:
  - type: web
    name: guarusolar
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    # Não há região no Brasil: Virginia (leste dos EUA) é a mais próxima de São Paulo.
    region: virginia
    branch: main
    # Publicação só pelo GitHub Actions (Actions › Publicar): roda as migrations antes e
    # chama o deploy hook. Push no main NÃO publica sozinho.
    autoDeploy: false
    # A Render só troca para a versão nova quando /saude responde 200 (a API alcança o banco).
    healthCheckPath: /saude
    envVars:
      - key: NODE_ENV
        value: production
      - key: TZ
        value: America/Sao_Paulo
      # Quantos proxies há na frente (a Render e o Cloudflare dela). Conferir no primeiro
      # deploy pelo log login_falhou (campo "origem" deve ser o IP de quem tentou).
      - key: TRUST_PROXY
        value: "1"
      - key: JWT_EXPIRES_IN
        value: 12h
      - key: JWT_EXPIRES_IN_TECNICO
        value: 7d
      # DESTINO DAS FOTOS. O valor aqui é o de PRODUÇÃO, de propósito: a Render reaplica os valores
      # literais deste arquivo a cada sincronização do Blueprint (toda vez que o render.yaml muda no
      # main), por cima do que estiver no painel. Até 09/10/2026 estava "disco": uma sincronização
      # devolveu a produção para "disco" e a API parou de receber fotos sem avisar ninguém.
      # NUNCA volte este valor para "disco". Se faltar alguma das três SUPABASE_* abaixo no painel, a
      # API sobe do mesmo jeito, em modo degradado: não recebe fotos, grita no log, mostra a faixa
      # vermelha no escritório e "recebendo": false no /saude.
      - key: STORAGE_PROVIDER
        value: supabase
      # Do projeto do Supabase de produção. "sync: false" = gerenciadas SÓ pelo painel: a Render
      # pede o valor ao criar o Blueprint e depois nunca mais mexe nelas.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: SUPABASE_BUCKET
        sync: false
      # Teto do Storage, em MB (plano gratuito do Supabase: cerca de 1 GB). A API avisa em 70% e
      # recusa fotos novas em 95%. Mude aqui e no painel se o plano mudar.
      - key: SUPABASE_STORAGE_LIMITE_MB
        value: 1024
      # Endereço do serviço (o nome pode ganhar um sufixo se "guarusolar" já existir na Render):
      # confira no painel e ajuste os dois abaixo.
      - key: API_URL_PUBLICA
        value: https://guarusolar.onrender.com
      - key: CORS_ORIGINS
        value: https://guarusolar.onrender.com
      # Segredos: preenchidos no painel ao criar o Blueprint (nunca no repositório).
      # As duas do banco com a conexão de SESSÃO do Supabase (porta 5432), sem pgbouncer=true.
      # JWT_SECRET: novo, só de produção (README, "Render"); trocá-lo encerra todas as sessões.
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        sync: false
