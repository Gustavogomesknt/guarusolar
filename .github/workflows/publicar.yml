# Publicação em produção: só manual (aba Actions › Publicar › Run workflow, na branch main).
# 1. aplica as migrations no banco de produção (se falharem, nada é publicado);
# 2. chama o deploy hook da Render, que compila o Dockerfile do commit mais recente do main;
# 3. espera o /saude responder com a versão (commit) nova e o banco ok.
# Segredos: PRODUCAO_DATABASE_URL (Session pooler de produção, porta 5432) e
# RENDER_DEPLOY_HOOK_URL. Variável: PRODUCAO_URL (ex.: https://guarusolar.onrender.com).
# README, "Publicar em produção (Render)".
name: Publicar

on:
  workflow_dispatch:

# nunca duas publicações ao mesmo tempo
concurrency: publicar

jobs:
  publicar:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.12'
          cache: npm
      - run: npm ci

      # Migrations ANTES da versão nova: a antiga segue no ar com o banco já expandido
      # (por isso só adições numa publicação; CLAUDE.md, "Migrations em produção").
      - name: Migrations
        env:
          DATABASE_URL: ${{ secrets.PRODUCAO_DATABASE_URL }}
          DIRECT_URL: ${{ secrets.PRODUCAO_DATABASE_URL }}
        # antes de tudo: o segredo aponta MESMO para o banco de produção? (marca no banco)
        run: |
          npm run db:conferir-producao
          npm run db:migrate:deploy

      - name: Publicar na Render
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: curl -fsS -X POST "$HOOK" > /dev/null

      # A Render só troca o tráfego quando /saude responde 200; aqui confirmamos que a versão
      # no ar é este commit. O plano gratuito compila devagar: até ~20 min.
      - name: Conferir a versão no ar
        env:
          URL: ${{ vars.PRODUCAO_URL }}
          ESPERADA: ${{ github.sha }}
        run: |
          for tentativa in $(seq 1 80); do
            resposta=$(curl -fsS --max-time 70 "$URL/saude" || true)
            versao=$(echo "$resposta" | jq -r '.versao // empty' 2>/dev/null || true)
            if [ "$versao" = "$ESPERADA" ]; then
              echo "No ar: $resposta"
              # o banco em uso tem a marca de produção? (senão, a DATABASE_URL da Render está errada)
              if [ "$(echo "$resposta" | jq -r '.producao')" != "true" ]; then
                echo "::error::A versão está no ar, mas ligada num banco SEM a marca de produção. Confira DATABASE_URL e DIRECT_URL na Render (Environment)."
                exit 1
              fi
              exit 0
            fi
            echo "Ainda não (no ar: ${versao:-sem resposta}); nova conferência em 15 s"
            sleep 15
          done
          echo "::error::A versão $ESPERADA não entrou no ar. Veja Events e Logs no painel da Render; a versão anterior continua atendendo."
          exit 1
